name: smartinvite
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    shm_size: 64mb
    mem_limit: 384m
    environment:
      POSTGRES_DB: smartinvite
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_SUPER_PASSWORD:?Set_PG_SUPER_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set_APP_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartinvite"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [database_net]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${APP_IMAGE:?Set_APP_IMAGE}
    restart: unless-stopped
    init: true
    mem_limit: 650m
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://smartinvite:${APP_DB_PASSWORD}@db:5432/smartinvite
      AUTH_SECRET: ${AUTH_SECRET:?Set_AUTH_SECRET}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 35s
    networks: [database_net, proxy_net]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    environment:
      DOMAIN: ${DOMAIN:?Set_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [proxy_net]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  database_net:
    internal: true
  proxy_net: {}

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
